name: CI Core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run test:syntax
      - name: Run unit tests
        run: npm test
      - name: Upload test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-test-reports-node-${{ matrix.node-version }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore

  simulation:
    name: Full M2 simulation (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_OPTIONS: --max-old-space-size=512
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install development dependencies
        run: npm ci
      - name: Run the one-shot 10,000/1,000 simulation gate
        run: npm run test:m2:simulation
      - name: Generate a strict replay fixture
        run: node scripts/generate-replay-fixtures.mjs
      - name: Upload M2 simulation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: m2-simulation-report
          path: |
            m2-simulation-report.json
            m2-strict-replay.json
          if-no-files-found: error
