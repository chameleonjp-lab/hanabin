name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - "styles/**"
      - "src/**"
      - .github/workflows/pages.yml
      - .github/workflows/public-release.yml
      - playwright.public.config.mjs
      - scripts/check-pages-source.mjs
      - tests/e2e/m7-public-release.spec.mjs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Prepare static game files
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Prepare public artifact
        run: |
          rm -rf site
          mkdir -p site
          cp index.html site/
          cp -R styles site/
          cp -R src site/
          touch site/.nojekyll
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
