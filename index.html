<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080b18" />
    <meta name="description" content="HANABINの静的配信基盤" />
    <title>HANABIN</title>
    <link rel="stylesheet" href="./styles/base.css" />
    <script>
      (() => {
        const showError = (message = "ページの読み込みに失敗しました。再読み込みしてください。") => {
          const status = document.querySelector("#app-status");
          const error = document.querySelector("#app-error");
          if (status) {
            status.textContent = "読み込みに失敗しました";
          }
          if (error) {
            error.hidden = false;
            const detail = error.querySelector("[data-error-detail]");
            if (detail) detail.textContent = message;
          }
        };

        window.__hanabinShowError = showError;
        window.addEventListener(
          "error",
          (event) => {
            if (event.error || event.target?.tagName === "SCRIPT") showError();
          },
          true,
        );
        window.addEventListener("unhandledrejection", () => showError());
        window.setTimeout(() => {
          if (!window.__hanabinAppReady) showError();
        }, 5000);
      })();
    </script>
  </head>
  <body>
    <main id="app" class="app-shell" data-state="loading">
      <section class="app-card" aria-labelledby="app-title">
        <p class="eyebrow">HANABIN / FOUNDATION</p>
        <h1 id="app-title">花火の連鎖を準備中です</h1>
        <p id="app-status" class="status" role="status" aria-live="polite">読み込み中…</p>

        <div class="foundation-stage" aria-label="ゲーム画面を配置する領域">
          <span>静的ページ基盤</span>
        </div>

        <p id="orientation-guide" class="orientation-guide" hidden>
          横向きにすると、ゲーム画面を確認しやすくなります。
        </p>
        <p class="notice">この画面はM1の確認用です。ゲームのルールや得点はまだ実装していません。</p>
      </section>
    </main>

    <section id="app-error" class="app-error" role="alert" hidden>
      <h2>読み込みに失敗しました</h2>
      <p data-error-detail>ページを再読み込みしてください。</p>
    </section>

    <noscript>
      <section class="app-error app-error--noscript" role="alert">
        <h2>JavaScriptを有効にしてください</h2>
        <p>このページを表示するには、ブラウザのJavaScriptを有効にしてください。</p>
      </section>
    </noscript>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
